name: Update Fantasy Data

on:
  schedule:
    # Runs at 12:25 UTC (8:25 AM EDT / 7:25 AM EST) every Tuesday (10 mins before recap email)
    - cron: '25 12 * * 2'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Run data fetch script
      env:
        ESPN_S2: ${{ secrets.ESPN_S2 }}
        ESPN_SWID: ${{ secrets.SWID }}
      run: python fetch_espn.py
      
    - name: Commit and push if changed
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add data.js
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated data sync" && git push)
